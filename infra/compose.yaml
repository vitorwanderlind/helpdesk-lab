
services:
  postgres:
    image: postgres:17
    container_name: helpdesk-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: helpdesk_lab
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_lab"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
